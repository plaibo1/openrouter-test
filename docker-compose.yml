services:
  app:
    build: .
    image: openrouter-stt
    restart: unless-stopped
    # Переменные (OPENROUTER_API_KEY, SUMMARY_MODEL) передаются в контейнер при запуске, в образ не попадают.
    # Dokploy записывает переменные из вкладки Environment в .env рядом с compose-файлом.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
    # Порт наружу не публикуем: в Dokploy трафик к контейнеру ведёт Traefik через домен.
    # Для локального запуска см. docker-compose.local.yml
    expose:
      - "3000"
